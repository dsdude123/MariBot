name: Docker

on:
  # Deliberately not filtered by base branch. A pull request stacked on another
  # pull request has that branch as its base, not master, and a stack whose
  # lower PRs never build is a stack whose CI tells you nothing until the day it
  # lands. GitHub builds the merge of head into whatever the base is, so each PR
  # is checked against the state it will actually merge into.
  pull_request:
    paths:
      # Listed explicitly even though the project globs already match them —
      # the Dockerfiles are the thing this job actually exercises.
      - 'MariBot-Core/Dockerfile'
      - 'MariBot.Worker/Dockerfile'
      - 'MariBot-Core/**'
      - 'MariBot.Worker/**'
      - 'MariBot-Common/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [master]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Without this the matrix splices the Dockerfile path into the check name,
    # producing an unreadable (and untypeable) required-status-check.
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Both images are built on every run rather than filtered by path: they
    # share MariBot-Common, and a PR that changes it has to prove both still
    # build. They are independent, so one failing should not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: maribot-core
            dockerfile: MariBot-Core/Dockerfile
          - image: maribot-worker
            dockerfile: MariBot.Worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PRs from a fork get a read-only GITHUB_TOKEN, so they can only ever
      # build. Skipping login there keeps them building instead of erroring on
      # a push they were never allowed to make.
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is deliberately disabled for PRs: a PR should own exactly
      # one mutable tag (pr-<n>) per image so docker-cleanup.yml can remove it
      # by name when the PR closes. Per-sha tags would outlive that cleanup.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image: one shared cache would have the two builds
          # evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summarise published tags
        if: github.event.pull_request.head.repo.fork != true
        run: |
          {
            echo "### Published images — ${{ matrix.image }}"
            echo
            echo 'Pull one of these in Portainer:'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
