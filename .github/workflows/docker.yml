name: Docker

on:
  pull_request:
    branches: [master]
    paths:
      # Listed explicitly even though 'MariBot-Core/**' already matches it —
      # the Dockerfile is the thing this job actually exercises.
      - 'MariBot-Core/Dockerfile'
      - 'MariBot-Core/**'
      - 'MariBot-Common/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [master]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/maribot-core

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PRs from a fork get a read-only GITHUB_TOKEN, so they can only ever
      # build. Skipping login there keeps them building instead of erroring on
      # a push they were never allowed to make.
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is deliberately disabled for PRs: a PR should own exactly
      # one mutable tag (pr-<n>) so docker-cleanup.yml can remove it by name
      # when the PR closes. Per-sha tags would outlive that cleanup.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MariBot-Core/Dockerfile
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise published tags
        if: github.event.pull_request.head.repo.fork != true
        run: |
          {
            echo "### Published images"
            echo
            echo 'Pull one of these in Portainer:'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
