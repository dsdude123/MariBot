name: Docker Cleanup

# Removes the throwaway pr-<n> image once its PR is closed, so preview builds
# don't pile up in GHCR. Deliberately not filtered on paths: a PR that stopped
# touching Docker files still has an image to clean up.
on:
  pull_request:
    types: [closed]

jobs:
  delete-preview-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete pr-${{ github.event.number }} from GHCR
        # Cleanup failing must never mark a merged PR as broken. If this step
        # goes red, see the note at the bottom of this file.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packageName = 'maribot-core';
            const tag = `pr-${context.payload.number}`;

            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              { username: owner, package_type: 'container', package_name: packageName, per_page: 100 }
            );

            const match = versions.find(v =>
              (v.metadata?.container?.tags ?? []).includes(tag)
            );

            if (!match) {
              core.info(`No image tagged ${tag} — nothing to delete.`);
              return;
            }

            await github.rest.packages.deletePackageVersionForUser({
              username: owner,
              package_type: 'container',
              package_name: packageName,
              package_version_id: match.id,
            });

            core.info(`Deleted ${tag} (version ${match.id}).`);

# Only the pr-<n> tagged version is removed. Untagged versions left behind by
# overwriting that tag are NOT pruned: for multi-arch images those untagged
# entries are the per-platform children of a live manifest list, and deleting
# them breaks the tag that points at them. Prune those by hand if they add up.
#
# GITHUB_TOKEN can be refused when deleting versions of a *user*-owned package
# (as opposed to an org-owned one). If this step logs a 403, create a classic
# PAT with the delete:packages scope and save it as the GHCR_CLEANUP_TOKEN
# repository secret — it is picked up automatically above.
