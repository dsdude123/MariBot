name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows runs the whole solution.
          - os: windows-latest
            test-projects: MariBot.sln
          # MariBot.Worker's image handlers still build Content paths with
          # hardcoded "\" separators, so its tests only pass on Windows. Until
          # Worker is made cross-platform, Linux covers the projects that are.
          - os: ubuntu-latest
            test-projects: >-
              MariBot-Core.Tests/MariBot-Core.Tests.csproj
              MariBot-Common.Tests/MariBot-Common.Tests.csproj
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MariBot.sln

      # Always compile everything, on both platforms — a Worker compile error on
      # Linux should still fail the build even though its tests are skipped there.
      - name: Build
        run: dotnet build MariBot.sln --no-restore

      - name: Test
        shell: bash
        run: |
          for proj in ${{ matrix.test-projects }}; do
            echo "::group::dotnet test $proj"
            dotnet test "$proj" --no-build --verbosity normal
            echo "::endgroup::"
          done
