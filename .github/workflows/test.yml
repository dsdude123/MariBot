name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    # Without this the matrix splices the OS list into the check name, producing
    # an unreadable (and untypeable) required-status-check.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Magick.NET's OpenMP build needs libgomp at load time. Without it the
      # native library is found but cannot load, and every image test fails on a
      # type initializer. Installed explicitly rather than relying on whatever
      # the runner image happens to ship.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Restore dependencies
        run: dotnet restore MariBot.sln

      - name: Build
        run: dotnet build MariBot.sln --no-restore

      # The whole solution on both platforms. MariBot.Worker used to be Windows
      # only — its handlers built paths with hardcoded "\" separators — so Linux
      # ran a subset; it is portable now.
      - name: Test
        run: dotnet test MariBot.sln --no-build --verbosity normal
