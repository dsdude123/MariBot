# Deployment compose file. Pulls the published image, so it works from a
# Portainer stack with no repo checkout.
#
# Running `docker compose up` inside a clone of this repo instead ALSO picks up
# docker-compose.override.yml automatically, which swaps the pulled image for a
# local source build. Portainer never sees that file.

services:
  maribot-core:
    # Set MARIBOT_IMAGE_TAG=pr-70 to trial a pull request before merging it.
    image: ghcr.io/dsdude123/maribot-core:${MARIBOT_IMAGE_TAG:-latest}
    container_name: maribot-core
    restart: unless-stopped
    ports:
      # Workers post finished jobs to port 8091 on whatever address they saw the
      # request come from, and that port is hardcoded in MariBot.Worker. Under
      # bridge networking the workers see the Docker host's address, so 8091 has
      # to be published on the host for results to land.
      - "8091:8091"

    # A bare NAME here means "pass through from the host / Portainer stack
    # environment". If it isn't set there, the variable is not defined in the
    # container at all and the image's own appsettings.json value stands — so
    # you only need to list the ones you actually want to override.
    # "__" maps to ":" in .NET configuration, i.e. DiscordSettings:BotToken.
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DiscordSettings__BotToken
      - DiscordSettings__Prefix
      - DiscordSettings__GoogleCloudKey
      - DiscordSettings__GoogleCustomSearchId
      - DiscordSettings__OpenAiApiKey
      - DiscordSettings__OpenAiOrganization
      - DiscordSettings__WolframAlphaAppId
      - DiscordSettings__TwitterApiKey
      - DiscordSettings__TwitterApiKeySecret
      - DiscordSettings__BlackForestLabsApiKey
      - DiscordSettings__GrokApiKey
      - DiscordSettings__IGDBClientId
      - DiscordSettings__IGDBClientSecret
      - DiscordSettings__YahooFantasyClientId
      - DiscordSettings__YahooFantasyClientSecret
      # Shared secret workers present to register. Unset means no worker can
      # register at all, which is the safe direction to fail but does mean the
      # bot answers every image command with "no workers are available".
      - WorkerSettings__PreSharedKey=${MARIBOT_WORKER_KEY:?set MARIBOT_WORKER_KEY}

    # appsettings.json, webcams.json and dynamic-config.json all ship inside the
    # image — none of them need to be supplied here. There is no worker list to
    # supply either: workers register themselves.
    #
    # dynamic-config.json in particular must NOT be bind-mounted: the bot
    # refreshes it from GitHub on a timer and replaces the file on disk, and a
    # single-file bind mount cannot be unlinked from inside the container.
    #
    # The image already knows where everything goes, so these only decide where
    # the data is kept. /app/config holds writable config — currently the
    # rotating Yahoo OAuth token, which must outlive a container recreate.
    #
    # To keep that alongside config you manage yourself, swap the named volume
    # for a directory on the host:
    #   - /srv/maribot/config:/app/config
    # Mount the directory rather than individual files: Docker creates a missing
    # directory, whereas a single-file mount whose source doesn't exist silently
    # becomes an empty directory instead.
    volumes:
      - maribot-config:/app/config
      - maribot-data:/app/data
      - maribot-logs:/app/logs
      - maribot-yt:/app/yt-downloads

  # Optional. Delete this service if your workers run elsewhere — a Windows box
  # with a GPU, most likely, since this image is CPU-only: OCR and Stable
  # Diffusion drive Anaconda environments that exist only there.
  #
  # Nothing on the Core side needs to know about it. The worker registers itself
  # on startup with the shared key below and heartbeats to stay registered, and
  # Core drops it when it stops checking in. Workers elsewhere join the same way:
  # give them CoreEndpoint, the same key, and an AdvertisedEndpoint this Core can
  # actually reach.
  maribot-worker:
    image: ghcr.io/dsdude123/maribot-worker:${MARIBOT_IMAGE_TAG:-latest}
    container_name: maribot-worker
    restart: unless-stopped

    # Deliberately not published to the host. Core reaches the worker by the
    # address it registered under, on the compose network, and finished jobs
    # travel back to port 8091 on whatever address the worker saw the request
    # arrive from — Core's own address on that same network. Publish 8092 only
    # for a worker that has to serve a Core running outside this stack.
    expose:
      - "8092"

    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Where to register, and the key to do it with. The key has to match
      # Core's.
      - WorkerSettings__CoreEndpoint=http://maribot-core:8091
      - WorkerSettings__PreSharedKey=${MARIBOT_WORKER_KEY:?set MARIBOT_WORKER_KEY}
      # The address Core should post jobs to. On a compose network that is the
      # service name; a worker behind NAT needs whatever address Core can reach.
      - WorkerSettings__AdvertisedEndpoint=http://maribot-worker:8092
      # CPU only: the GPU commands need Anaconda environments this image has no
      # way to provide, and claiming a capability it cannot serve just routes
      # those jobs here to fail.
      - WorkerSettings__Capabilities__0=CPU

    # Everything the worker reads — Content, the Python scripts, appsettings.json
    # — ships in the image, so this is only about keeping the log file across a
    # container recreate.
    volumes:
      - maribot-worker-logs:/app/logs

volumes:
  maribot-config:
  maribot-data:
  maribot-logs:
  maribot-yt:
  maribot-worker-logs:
